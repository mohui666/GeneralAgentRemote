[package]
name = "agent-remote-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-remote-protocol = { path = "../protocol" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "History",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "KeyboardEvent",
    "MessageEvent",
    "Navigator",
    "Performance",
    "Storage",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "Window",
    "Clipboard",
    "console",
] }
yew.workspace = true

[[bin]]
name = "agent-remote-web"
path = "src/main.rs"
